<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#004cd4"/>
      <stop offset="50%" stop-color="#002d9c"/>
      <stop offset="100%" stop-color="#00144f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background with slight corner radius for preview, browsers clip to maskable shape -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>

  <!-- Top Glass Highlight Curve -->
  <path d="M 0 160 Q 256 60 512 210 L 512 0 L 0 0 Z" fill="url(#shine)"/>

  <!-- Brand Typography SUNTEK -->
  <g filter="url(#shadow)">
    <!-- Shadow stroke -->
    <text x="256" y="248"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="900"
          font-style="italic"
          font-size="88"
          fill="#001133"
          stroke="#001133"
          stroke-width="12"
          text-anchor="middle"
          letter-spacing="-2">SUNTEK</text>
    <!-- Foreground text -->
    <text x="256" y="248"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="900"
          font-style="italic"
          font-size="88"
          fill="#ffffff"
          text-anchor="middle"
          letter-spacing="-2">SUNTEK</text>
  </g>

  <!-- POS Emerald Pill Badge -->
  <g filter="url(#shadow)">
    <rect x="146" y="315" width="220" height="92" rx="46" fill="#10b981"/>
    <!-- Pill Highlight -->
    <rect x="150" y="319" width="212" height="42" rx="21" fill="#ffffff" fill-opacity="0.25"/>
    <text x="256" y="380"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="900"
          font-size="52"
          fill="#022c1e"
          text-anchor="middle"
          letter-spacing="5">POS</text>
  </g>
</svg>
